# ==============================================================================
# Configuracoes da Aplicacao - Atividade 02 (PUC Minas)
# ==============================================================================

spring.application.name=atividade2_login

# Porta padrao do servidor web
server.port=8080

# Configuracao de encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# ==============================================================================
# Configuracoes de Envio de E-mail (Spring Mail / SMTP)
# Para envio real via SMTP (ex: Gmail), configure as variaveis de ambiente no SO:
# SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD
# Caso nao configuradas, o sistema opera em modo de desenvolvimento, registrando
# o token de recuperacao nos logs da aplicacao.
# ==============================================================================
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ==============================================================================
# Thymeleaf - Cache desabilitado para desenvolvimento
# ==============================================================================
spring.thymeleaf.cache=false
