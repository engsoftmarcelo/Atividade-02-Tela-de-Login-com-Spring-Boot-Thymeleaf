<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo | PUC Minas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <div class="home-layout">
        <!-- Barra Superior de Navegação -->
        <header class="home-nav admin-nav">
            <div class="nav-brand">
                <img th:src="@{/images/brasao_puc.svg}" alt="PUC Minas Logo">
                <div>
                    <div class="nav-brand-title">PUC Minas</div>
                    <div class="nav-brand-sub admin-sub">Painel Administrativo</div>
                </div>
            </div>

            <div class="nav-actions">
                <span class="admin-badge-nav">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                    </svg>
                    ADMIN
                </span>
                <span class="nav-user-badge-admin">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <span th:text="${usuario}">Admin</span>
                </span>

                <!-- Logout via POST pelo Spring Security -->
                <form th:action="@{/logout}" method="post" style="display: inline;">
                    <button type="submit" class="btn-logout" style="width: auto; padding: 8px 16px;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                            <polyline points="16 17 21 12 16 7"></polyline>
                            <line x1="21" y1="12" x2="9" y2="12"></line>
                        </svg>
                        <span>Sair</span>
                    </button>
                </form>
            </div>
        </header>

        <!-- Conteudo Principal -->
        <main class="home-content">
            <div class="home-glass-card admin-card">
                <!-- Avatar Admin com ícone de escudo -->
                <div class="admin-avatar">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                    </svg>
                </div>

                <div class="admin-role-tag">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
                        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                    </svg>
                    Administrador do Sistema
                </div>

                <h1 class="home-title admin-title"
                    th:text="'Olá, ' + ${usuario != null ? usuario : 'Administrador'} + '!'">Olá, Administrador!</h1>
                <p class="home-subtitle">Área Restrita de Administração • Pontifícia Universidade Católica de Minas Gerais</p>

                <!-- Grid de Dados do Admin -->
                <div class="profile-grid">
                    <div class="profile-item">
                        <svg class="profile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <div>
                            <span class="profile-label">Administrador</span>
                            <span class="profile-value" th:text="${usuario != null ? usuario : 'N/A'}">N/A</span>
                        </div>
                    </div>

                    <div class="profile-item">
                        <svg class="profile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                        </svg>
                        <div>
                            <span class="profile-label">Segurança</span>
                            <span class="profile-value profile-secure">Protegido com BCrypt</span>
                        </div>
                    </div>

                    <div class="profile-item">
                        <svg class="profile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                        <div>
                            <span class="profile-label">Sessão</span>
                            <span class="profile-value" id="admin-session-time">Ativa</span>
                        </div>
                    </div>

                    <div class="profile-item">
                        <svg class="profile-icon admin-icon-amber" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="16" y1="2" x2="16" y2="6"></line>
                            <line x1="8" y1="2" x2="8" y2="6"></line>
                            <line x1="3" y1="10" x2="21" y2="10"></line>
                        </svg>
                        <div>
                            <span class="profile-label">Perfil</span>
                            <span class="profile-value admin-role-value">ADMIN</span>
                        </div>
                    </div>
                </div>

                <!-- Acesso rápido -->
                <div class="admin-quick-actions">
                    <div class="admin-stat">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                            <circle cx="9" cy="7" r="4"></circle>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                        </svg>
                        <div>
                            <span class="stat-label">Gestão</span>
                            <span class="stat-value">Usuários</span>
                        </div>
                    </div>

                    <div class="admin-stat">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
                        </svg>
                        <div>
                            <span class="stat-label">Monitor</span>
                            <span class="stat-value">Sistema</span>
                        </div>
                    </div>

                    <div class="admin-stat">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="3"></circle>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                        </svg>
                        <div>
                            <span class="stat-label">Config</span>
                            <span class="stat-value">Opções</span>
                        </div>
                    </div>
                </div>

                <!-- Botão de Logout -->
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn-logout">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                            <polyline points="16 17 21 12 16 7"></polyline>
                            <line x1="21" y1="12" x2="9" y2="12"></line>
                        </svg>
                        <span>Encerrar Sessão Administrativa</span>
                    </button>
                </form>
            </div>
        </main>
    </div>

    <script>
        /* Exibe a data/hora atual na sessão */
        (function() {
            const el = document.getElementById('admin-session-time');
            if (el) {
                const now = new Date();
                el.textContent = now.toLocaleString('pt-BR', {
                    day: '2-digit', month: '2-digit', year: 'numeric',
                    hour: '2-digit', minute: '2-digit'
                });
            }
        })();
    </script>
</body>
</html>
