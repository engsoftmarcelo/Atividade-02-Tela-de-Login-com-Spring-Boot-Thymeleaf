<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUC Minas - Painel do Aluno</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <!-- GSAP e VanillaTilt Locais para Microinterações -->
    <script th:src="@{/js/vendor/gsap.min.js}"></script>
    <script th:src="@{/js/vendor/vanilla-tilt.min.js}"></script>
</head>
<body>
    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <div class="home-shell">
        <!-- Barra Superior -->
        <header class="home-nav">
            <div class="nav-brand">
                <img th:src="@{/images/brasao_puc.svg}" alt="PUC Minas Logo">
                <div>
                    <div class="nav-brand-title">PUC Minas</div>
                    <div class="nav-brand-sub">Portal de Aplicações Web</div>
                </div>
            </div>

            <!-- Logout via POST pelo Spring Security -->
            <form th:action="@{/logout}" method="post" style="display: inline;">
                <button type="submit" class="btn-logout" style="width: auto; padding: 8px 16px;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    <span>Sair</span>
                </button>
            </form>
        </header>

        <!-- Conteúdo Principal Centrado -->
        <main class="home-main">
            <div class="home-card">
                <div class="home-avatar"
                     th:text="${currentUser != null and !currentUser.name.isEmpty() ? #strings.substring(currentUser.name, 0, 1) : 'U'}">U</div>
                <h1 class="home-title" th:text="'Bem-vindo(a), ' + ${currentUser != null ? currentUser.name : 'Aluno'} + '!'">Bem-vindo, Aluno!</h1>
                <p class="home-subtitle">Área Restrita • Pontifícia Universidade Católica de Minas Gerais</p>

                <!-- Grid de Dados do Perfil -->
                <div class="profile-grid">
                    <div class="profile-item">
                        <svg class="profile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <div>
                            <span class="profile-label">Nome Completo</span>
                            <span class="profile-value" th:text="${currentUser != null ? currentUser.name : 'N/A'}">N/A</span>
                        </div>
                    </div>

                    <div class="profile-item">
                        <svg class="profile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                            <circle cx="8.5" cy="7" r="4"></circle>
                            <polyline points="17 11 19 13 23 9"></polyline>
                        </svg>
                        <div>
                            <span class="profile-label">Usuário</span>
                            <span class="profile-value" th:text="${currentUser != null ? '@' + currentUser.username : 'N/A'}">N/A</span>
                        </div>
                    </div>

                    <div class="profile-item">
                        <svg class="profile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                            <polyline points="22,6 12,13 2,6"></polyline>
                        </svg>
                        <div>
                            <span class="profile-label">E-mail</span>
                            <span class="profile-value" th:text="${currentUser != null ? currentUser.email : 'N/A'}">N/A</span>
                        </div>
                    </div>

                    <div class="profile-item">
                        <svg class="profile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                        </svg>
                        <div>
                            <span class="profile-label">Segurança</span>
                            <span class="profile-value profile-secure">Protegido com BCrypt</span>
                        </div>
                    </div>
                </div>

                <!-- Botão de Logout Principal -->
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn-logout">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                            <polyline points="16 17 21 12 16 7"></polyline>
                            <line x1="21" y1="12" x2="9" y2="12"></line>
                        </svg>
                        <span>Encerrar Sessão Segura</span>
                    </button>
                </form>
            </div>
        </main>
    </div>

    <!-- Script de Microinterações -->
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
