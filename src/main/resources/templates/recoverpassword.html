<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUC Minas - Recuperação de Senha</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <!-- Bibliotecas Locais (Zero Dependência Externa) -->
    <script th:src="@{/js/vendor/three.min.js}"></script>
    <script th:src="@{/js/vendor/GLTFLoader.js}"></script>
    <script th:src="@{/js/vendor/gsap.min.js}"></script>
    <script th:src="@{/js/vendor/vanilla-tilt.min.js}"></script>
</head>
<body>
    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <div class="auth-shell">
        <!-- Vitrine 3D Institucional PUC Minas -->
        <div class="auth-visual">
            <div class="auth-brand-badge">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                    <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                </svg>
                PUC Minas
            </div>
            <h1 class="auth-visual-title">Recuperação de Senha</h1>
            <p class="auth-visual-subtitle">Engenharia de Software</p>

            <div class="canvas-container" id="puc-3d-container">
                <canvas id="puc-3d-canvas"></canvas>
                <img id="puc-3d-fallback" class="canvas-fallback-img" th:src="@{/images/brasao_puc.svg}" alt="Brasão PUC Minas">
            </div>
        </div>

        <!-- Formulário em Glassmorphism -->
        <div class="auth-main">
            <div class="auth-card">
                <div class="auth-header">
                    <h2 class="auth-title">Esqueceu a Senha?</h2>
                    <p class="auth-subtitle">Informe seu e-mail institucional para receber o token de segurança</p>
                </div>

                <!-- Alerta de Erro -->
                <div th:if="${errorMessage}" class="alert alert-error">
                    <svg class="alert-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                    <span th:text="${errorMessage}"></span>
                </div>

                <form th:action="@{/recoverpassword}" method="post">
                    <div class="form-grid">
                        <div class="input-group">
                            <label class="input-label" for="email">E-mail Cadastrado</label>
                            <div class="input-container">
                                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                                    <polyline points="22,6 12,13 2,6"></polyline>
                                </svg>
                                <input type="email" id="email" name="email" th:value="${email}" class="input-control" placeholder="seu.email@pucminas.br" required autofocus>
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="btn-primary" style="margin-top: 0.5rem;">
                        <span>Enviar Instruções</span>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </form>

                <div class="auth-footer">
                    Lembrou da senha? <a th:href="@{/login}">Voltar ao Login</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts de Visualização e Efeitos -->
    <script th:src="@{/js/puc3d.js}"></script>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
