<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperação de Senha | PUC Minas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <div class="split-layout">
        <!-- Lado Esquerdo: Vitrine 3D Interativa com Fallback -->
        <div class="canvas-container">
            <div class="visual-content">
                <div class="brand-badge">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                    </svg>
                    PUC Minas
                </div>
                <h1 class="visual-title">Recuperação de Acesso</h1>
                <p class="visual-subtitle">Engenharia de Software</p>
            </div>

            <div class="stage-wrapper" id="stage-wrapper">
                <canvas id="puc-3d-canvas"></canvas>
                <img th:src="@{/images/brasao_puc.png}" class="fallback-img" alt="PUC Minas">
            </div>
        </div>

        <!-- Lado Direito: Formulário em Dark Glassmorphism -->
        <div class="form-container">
            <div class="glass-card" data-tilt data-tilt-max="3" data-tilt-glare="true" data-tilt-max-glare="0.18">
                <div class="stagger-item">
                    <h2>Recuperar Senha</h2>
                    <p class="subtitle">Informe seu e-mail institucional cadastrado para gerar seu token de recuperação.</p>
                </div>

                <!-- Alerta de Erro -->
                <div th:if="${errorMessage}" class="alert alert-error stagger-item">
                    <svg class="alert-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                    <span th:text="${errorMessage}"></span>
                </div>

                <form th:action="@{/recoverpassword}" method="post">
                    <div class="form-group stagger-item">
                        <label for="email">E-mail Cadastrado</label>
                        <div class="input-container">
                            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                                <polyline points="22,6 12,13 2,6"></polyline>
                            </svg>
                            <input type="email" id="email" name="email" th:value="${email}" placeholder="seu.email@pucminas.br" required autofocus autocomplete="off">
                        </div>
                    </div>

                    <div class="stagger-item" style="margin-top: 1.5rem;">
                        <button type="submit" class="btn-primary">
                            <span>Enviar Instruções</span>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="22" y1="2" x2="11" y2="13"></line>
                                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                            </svg>
                        </button>
                    </div>
                </form>

                <div class="form-footer stagger-item">
                    Lembrou da senha? <a th:href="@{/login}">Voltar ao Login</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Bibliotecas Locais (Zero Dependência Externa) -->
    <script th:src="@{/js/vendor/three.min.js}"></script>
    <script th:src="@{/js/vendor/GLTFLoader.js}"></script>
    <script th:src="@{/js/vendor/gsap.min.js}"></script>
    <script th:src="@{/js/vendor/vanilla-tilt.min.js}"></script>
    <script th:src="@{/js/puc3d.js}"></script>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
