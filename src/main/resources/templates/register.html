<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | PUC Minas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <div class="split-layout">
        <!-- Lado Esquerdo: Vitrine 3D Interativa com Fallback -->
        <div class="canvas-container">
            <div class="visual-content">
                <div class="brand-badge">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                    </svg>
                    PUC Minas
                </div>
                <h1 class="visual-title">Criar Nova Conta</h1>
                <p class="visual-subtitle">Engenharia de Software</p>
            </div>

            <div class="stage-wrapper" id="stage-wrapper">
                <canvas id="puc-3d-canvas"></canvas>
                <img th:src="@{/images/brasao_puc.png}" class="fallback-img" alt="PUC Minas">
            </div>
        </div>

        <!-- Lado Direito: Formulário em Dark Glassmorphism -->
        <div class="form-container">
            <div class="glass-card" data-tilt data-tilt-max="3" data-tilt-glare="true" data-tilt-max-glare="0.18">
                <div class="stagger-item">
                    <h2>Novo Usuário</h2>
                    <p class="subtitle">Preencha seus dados para criar sua conta no portal.</p>
                </div>

                <form th:action="@{/register}" th:object="${user}" method="post">
                    <!-- Nome Completo -->
                    <div class="form-group stagger-item">
                        <label for="name">Nome Completo</label>
                        <div class="input-container">
                            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                            <input type="text" id="name" th:field="*{name}" th:classappend="${#fields.hasErrors('name')} ? 'input-error' : ''" placeholder="Ex: Marcelo Silva" required autofocus autocomplete="off">
                        </div>
                        <div class="error-msg" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                    </div>

                    <!-- Nome de Usuário -->
                    <div class="form-group stagger-item">
                        <label for="reg-username">Nome de Usuário (Username)</label>
                        <div class="input-container">
                            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                                <circle cx="8.5" cy="7" r="4"></circle>
                                <polyline points="17 11 19 13 23 9"></polyline>
                            </svg>
                            <input type="text" id="reg-username" th:field="*{username}" th:classappend="${#fields.hasErrors('username')} ? 'input-error' : ''" placeholder="Ex: marcelo.silva" required autocomplete="off">
                        </div>
                        <div class="error-msg" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                    </div>

                    <!-- E-mail Institucional -->
                    <div class="form-group stagger-item">
                        <label for="reg-email">E-mail Institucional</label>
                        <div class="input-container">
                            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                                <polyline points="22,6 12,13 2,6"></polyline>
                            </svg>
                            <input type="email" id="reg-email" th:field="*{email}" th:classappend="${#fields.hasErrors('email')} ? 'input-error' : ''" placeholder="aluno@sga.pucminas.br" required autocomplete="off">
                        </div>
                        <div class="error-msg" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>

                    <!-- Senha de Acesso com Medidor Dinâmico Neon -->
                    <div class="form-group stagger-item">
                        <label for="password">Senha de Acesso</label>
                        <div class="input-container">
                            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                            <input type="password" id="password" th:field="*{password}" th:classappend="${#fields.hasErrors('password')} ? 'input-error' : ''" placeholder="Mínimo 6 caracteres" required>
                            <button type="button" class="toggle-password" data-target="password" aria-label="Mostrar senha">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                        <!-- Barra Neon Dinâmica de Força -->
                        <div class="password-meter-track">
                            <div id="pass-meter-fill" class="password-meter-fill"></div>
                        </div>
                        <span id="pass-meter-label" class="password-meter-label"></span>
                        <div class="error-msg" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                    </div>

                    <!-- Confirmação de Senha -->
                    <div class="form-group stagger-item">
                        <label for="confirmPassword">Confirmar Senha</label>
                        <div class="input-container">
                            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                            </svg>
                            <input type="password" id="confirmPassword" th:field="*{confirmPassword}" th:classappend="${#fields.hasErrors('confirmPassword')} ? 'input-error' : ''" placeholder="Repita a senha" required>
                            <button type="button" class="toggle-password" data-target="confirmPassword" aria-label="Mostrar senha">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                        <div class="error-msg" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                    </div>

                    <div class="stagger-item" style="margin-top: 1.5rem;">
                        <button type="submit" class="btn-primary">
                            <span>Concluir Cadastro</span>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="20 6 9 17 4 12"></polyline>
                            </svg>
                        </button>
                    </div>
                </form>

                <div class="form-footer stagger-item">
                    Já tem uma conta? <a th:href="@{/login}">Voltar para o Login</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Bibliotecas Locais (Zero Dependência Externa) -->
    <script th:src="@{/js/vendor/three.min.js}"></script>
    <script th:src="@{/js/vendor/GLTFLoader.js}"></script>
    <script th:src="@{/js/vendor/gsap.min.js}"></script>
    <script th:src="@{/js/vendor/vanilla-tilt.min.js}"></script>
    <script th:src="@{/js/puc3d.js}"></script>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
