<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | PUC Minas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/register.css}">
</head>
<body>
    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <div class="split-layout">
        <!-- Apresentacao visual com brasao 3D -->
        <div class="canvas-container">
            <div class="visual-content">
                <div class="brand-badge">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                    </svg>
                    PUC Minas
                </div>
                <h1 class="visual-title">Criar Nova Conta</h1>
                <p class="visual-subtitle">Engenharia de Software</p>
            </div>

            <div class="stage-wrapper" id="stage-wrapper">
                <canvas id="puc-3d-canvas"></canvas>
                <img th:src="@{/images/brasao_puc.png}" class="fallback-img" alt="PUC Minas">
            </div>
        </div>

        <!-- Formulario de Cadastro -->
        <div class="form-container">
            <div class="glass-card register-card">
                <div class="register-header">
                    <div class="register-icon-wrapper">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                            <circle cx="8.5" cy="7" r="4"></circle>
                            <line x1="20" y1="8" x2="20" y2="14"></line>
                            <line x1="23" y1="11" x2="17" y2="11"></line>
                        </svg>
                    </div>
                    <h2>Novo Usuário</h2>
                    <p class="subtitle">Preencha seus dados para criar sua conta no portal.</p>
                </div>

                <!-- Alerta de erro (email já cadastrado) -->
                <div th:if="${param.erro}" class="alert alert-error">
                    <svg class="alert-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                    <span>Este e-mail já está cadastrado. Tente outro ou faça login.</span>
                </div>

                <form th:action="@{/register}" method="post">
                    <!-- Etapa 1: Dados Pessoais -->
                    <div class="register-section">
                        <div class="section-label">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                            Dados Pessoais
                        </div>
                    </div>

                    <!-- Nome Completo -->
                    <div class="form-group">
                        <label for="nome">Nome Completo</label>
                        <div class="input-container">
                            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                            <input type="text" id="nome" name="nome" placeholder="Ex: Marcelo Silva" required autofocus autocomplete="off">
                        </div>
                    </div>

                    <!-- E-mail -->
                    <div class="form-group">
                        <label for="email">E-mail Institucional</label>
                        <div class="input-container">
                            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                                <polyline points="22,6 12,13 2,6"></polyline>
                            </svg>
                            <input type="email" id="email" name="email" placeholder="aluno@sga.pucminas.br" required autocomplete="off">
                        </div>
                    </div>

                    <!-- CPF e RG lado a lado -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="cpf">CPF</label>
                            <div class="input-container">
                                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                                    <line x1="6" y1="8" x2="18" y2="8"></line>
                                    <line x1="6" y1="12" x2="14" y2="12"></line>
                                </svg>
                                <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required autocomplete="off"
                                       maxlength="14" oninput="maskCPF(this)">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="rg">RG</label>
                            <div class="input-container">
                                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                                    <line x1="6" y1="8" x2="18" y2="8"></line>
                                    <line x1="6" y1="12" x2="10" y2="12"></line>
                                </svg>
                                <input type="text" id="rg" name="rg" placeholder="MG-00.000.000" required autocomplete="off">
                            </div>
                        </div>
                    </div>

                    <!-- Etapa 2: Informações Adicionais -->
                    <div class="register-section">
                        <div class="section-label">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                                <circle cx="12" cy="10" r="3"></circle>
                            </svg>
                            Informações Adicionais
                        </div>
                    </div>

                    <!-- Endereço -->
                    <div class="form-group">
                        <label for="endereco">Endereço</label>
                        <div class="input-container">
                            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                                <circle cx="12" cy="10" r="3"></circle>
                            </svg>
                            <input type="text" id="endereco" name="endereco" placeholder="Rua, Nº - Bairro, Cidade" required autocomplete="off">
                        </div>
                    </div>

                    <!-- Instituição -->
                    <div class="form-group">
                        <label for="instituicao">Instituição de Ensino</label>
                        <div class="input-container">
                            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
                                <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
                            </svg>
                            <input type="text" id="instituicao" name="instituicao" placeholder="PUC Minas - Unidade Coração Eucarístico" required autocomplete="off">
                        </div>
                    </div>

                    <!-- Etapa 3: Segurança -->
                    <div class="register-section">
                        <div class="section-label">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                            </svg>
                            Segurança
                        </div>
                    </div>

                    <!-- Senha -->
                    <div class="form-group">
                        <label for="senha">Senha de Acesso</label>
                        <div class="input-container">
                            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                            <input type="password" id="senha" name="senha" placeholder="Mínimo 6 caracteres" required
                                   oninput="checkPasswordStrength(this.value)">
                            <button type="button" class="toggle-password" onclick="togglePassword('senha', this)" aria-label="Mostrar senha">
                                <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                                <svg class="eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path>
                                    <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path>
                                    <line x1="1" y1="1" x2="23" y2="23"></line>
                                </svg>
                            </button>
                        </div>
                        <!-- Barra de forca da senha -->
                        <div class="password-meter-track">
                            <div id="pass-meter-fill" class="password-meter-fill"></div>
                        </div>
                        <span id="pass-meter-label" class="password-meter-label"></span>
                    </div>

                    <div style="margin-top: 1.5rem;">
                        <button type="submit" class="btn-primary">
                            <span>Concluir Cadastro</span>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="20 6 9 17 4 12"></polyline>
                            </svg>
                        </button>
                    </div>
                </form>

                <div class="form-footer">
                    Já tem uma conta? <a th:href="@{/login}">Voltar para o Login</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        /* Máscara de CPF */
        function maskCPF(input) {
            let v = input.value.replace(/\D/g, '');
            if (v.length > 11) v = v.slice(0, 11);
            v = v.replace(/(\d{3})(\d)/, '$1.$2');
            v = v.replace(/(\d{3})(\d)/, '$1.$2');
            v = v.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
            input.value = v;
        }

        /* Toggle de visibilidade de senha */
        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const eyeOpen = btn.querySelector('.eye-open');
            const eyeClosed = btn.querySelector('.eye-closed');
            if (input.type === 'password') {
                input.type = 'text';
                eyeOpen.style.display = 'none';
                eyeClosed.style.display = 'block';
            } else {
                input.type = 'password';
                eyeOpen.style.display = 'block';
                eyeClosed.style.display = 'none';
            }
        }

        /* Medidor de força da senha */
        function checkPasswordStrength(password) {
            const fill = document.getElementById('pass-meter-fill');
            const label = document.getElementById('pass-meter-label');
            let strength = 0;

            if (password.length >= 6) strength++;
            if (password.length >= 10) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^A-Za-z0-9]/.test(password)) strength++;

            const levels = [
                { width: '0%', color: 'transparent', text: '', shadow: 'none' },
                { width: '20%', color: '#ef4444', text: 'Muito fraca', shadow: '0 0 8px rgba(239,68,68,0.5)' },
                { width: '40%', color: '#f97316', text: 'Fraca', shadow: '0 0 8px rgba(249,115,22,0.5)' },
                { width: '60%', color: '#eab308', text: 'Razoável', shadow: '0 0 8px rgba(234,179,8,0.5)' },
                { width: '80%', color: '#22c55e', text: 'Forte', shadow: '0 0 8px rgba(34,197,94,0.5)' },
                { width: '100%', color: '#10b981', text: 'Muito forte', shadow: '0 0 8px rgba(16,185,129,0.5)' }
            ];

            const level = levels[strength];
            fill.style.width = level.width;
            fill.style.backgroundColor = level.color;
            fill.style.boxShadow = level.shadow;
            label.textContent = level.text;
            label.style.color = level.color;
        }
    </script>
</body>
</html>
