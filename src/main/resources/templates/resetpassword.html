<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha | PUC Minas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/resetpassword.css}">
</head>
<body>
    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <div class="split-layout">
        <!-- Apresentacao visual com brasao 3D -->
        <div class="canvas-container">
            <div class="visual-content">
                <div class="brand-badge">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                    </svg>
                    PUC Minas
                </div>
                <h1 class="visual-title">Nova Senha</h1>
                <p class="visual-subtitle">Engenharia de Software</p>
            </div>

            <div class="stage-wrapper" id="stage-wrapper">
                <canvas id="puc-3d-canvas"></canvas>
                <img th:src="@{/images/brasao_puc.png}" class="fallback-img" alt="PUC Minas">
            </div>
        </div>

        <!-- Formulario de Redefinição de Senha -->
        <div class="form-container">
            <div class="glass-card">
                <div class="reset-header">
                    <div class="reset-icon-wrapper">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path>
                        </svg>
                    </div>
                    <h2>Redefinir Senha</h2>
                    <p class="subtitle">Crie uma nova senha segura para sua conta.</p>
                </div>

                <!-- Alerta de erro (senhas não conferem) -->
                <div th:if="${param.erro != null and param.erro[0] == 'senhas'}" class="alert alert-error">
                    <svg class="alert-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                    <span>As senhas não conferem. Por favor, tente novamente.</span>
                </div>

                <form th:action="@{/resetpassword}" method="post">
                    <!-- Token oculto (segurança) -->
                    <input type="hidden" name="token" th:value="${token}">

                    <!-- Nova Senha -->
                    <div class="form-group">
                        <label for="senha">Nova Senha</label>
                        <div class="input-container">
                            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                            <input type="password" id="senha" name="senha" placeholder="Mínimo 6 caracteres" required autofocus
                                   oninput="checkPasswordStrength(this.value)">
                            <button type="button" class="toggle-password" onclick="togglePassword('senha', this)" aria-label="Mostrar senha">
                                <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                                <svg class="eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path>
                                    <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path>
                                    <line x1="1" y1="1" x2="23" y2="23"></line>
                                </svg>
                            </button>
                        </div>
                        <!-- Barra de força da senha -->
                        <div class="password-meter-track">
                            <div id="pass-meter-fill" class="password-meter-fill"></div>
                        </div>
                        <span id="pass-meter-label" class="password-meter-label"></span>
                    </div>

                    <!-- Confirmar Nova Senha -->
                    <div class="form-group">
                        <label for="confirmarSenha">Confirmar Nova Senha</label>
                        <div class="input-container">
                            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                            </svg>
                            <input type="password" id="confirmarSenha" name="confirmarSenha" placeholder="Repita a nova senha" required
                                   oninput="checkPasswordMatch()">
                            <button type="button" class="toggle-password" onclick="togglePassword('confirmarSenha', this)" aria-label="Mostrar senha">
                                <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                                <svg class="eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path>
                                    <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path>
                                    <line x1="1" y1="1" x2="23" y2="23"></line>
                                </svg>
                            </button>
                        </div>
                        <div id="match-msg" class="password-match-msg"></div>
                    </div>

                    <div style="margin-top: 1.5rem;">
                        <button type="submit" class="btn-primary">
                            <span>Salvar Nova Senha</span>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="20 6 9 17 4 12"></polyline>
                            </svg>
                        </button>
                    </div>
                </form>

                <div class="form-footer">
                    <a th:href="@{/login}">Voltar ao Login</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        /* Toggle de visibilidade de senha */
        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const eyeOpen = btn.querySelector('.eye-open');
            const eyeClosed = btn.querySelector('.eye-closed');
            if (input.type === 'password') {
                input.type = 'text';
                eyeOpen.style.display = 'none';
                eyeClosed.style.display = 'block';
            } else {
                input.type = 'password';
                eyeOpen.style.display = 'block';
                eyeClosed.style.display = 'none';
            }
        }

        /* Medidor de força da senha */
        function checkPasswordStrength(password) {
            const fill = document.getElementById('pass-meter-fill');
            const label = document.getElementById('pass-meter-label');
            let strength = 0;

            if (password.length >= 6) strength++;
            if (password.length >= 10) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^A-Za-z0-9]/.test(password)) strength++;

            const levels = [
                { width: '0%', color: 'transparent', text: '', shadow: 'none' },
                { width: '20%', color: '#ef4444', text: 'Muito fraca', shadow: '0 0 8px rgba(239,68,68,0.5)' },
                { width: '40%', color: '#f97316', text: 'Fraca', shadow: '0 0 8px rgba(249,115,22,0.5)' },
                { width: '60%', color: '#eab308', text: 'Razoável', shadow: '0 0 8px rgba(234,179,8,0.5)' },
                { width: '80%', color: '#22c55e', text: 'Forte', shadow: '0 0 8px rgba(34,197,94,0.5)' },
                { width: '100%', color: '#10b981', text: 'Muito forte', shadow: '0 0 8px rgba(16,185,129,0.5)' }
            ];

            const level = levels[strength];
            fill.style.width = level.width;
            fill.style.backgroundColor = level.color;
            fill.style.boxShadow = level.shadow;
            label.textContent = level.text;
            label.style.color = level.color;

            checkPasswordMatch();
        }

        /* Verificar se as senhas coincidem */
        function checkPasswordMatch() {
            const senha = document.getElementById('senha').value;
            const confirmar = document.getElementById('confirmarSenha').value;
            const msg = document.getElementById('match-msg');

            if (confirmar.length === 0) {
                msg.textContent = '';
                msg.className = 'password-match-msg';
                return;
            }

            if (senha === confirmar) {
                msg.textContent = '✓ As senhas coincidem';
                msg.className = 'password-match-msg match-ok';
            } else {
                msg.textContent = '✗ As senhas não coincidem';
                msg.className = 'password-match-msg match-error';
            }
        }
    </script>
</body>
</html>
